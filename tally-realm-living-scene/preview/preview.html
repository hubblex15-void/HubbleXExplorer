<style>
:root{--cream:#f6e9d2;--cocoa:#3b2a20;--oak:#b87b4b;--moss:#7fa35b;--honey:#e9b44c;--bg:#2a1f1a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--cream);font:14px/1.4 system-ui,sans-serif}
header{padding:10px 16px;display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}header h1{margin:0;font-size:18px}header span{opacity:.7;font-size:12px}
.stage{position:relative;max-width:1280px;margin:0 auto;border:4px solid var(--oak);background:#000}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated}
.sign{position:absolute;left:10px;top:10px;padding:6px 12px;background:rgba(59,42,32,.85);border:3px solid var(--oak);box-shadow:0 3px 0 rgba(0,0,0,.4)}
#clock{font-size:22px;font-weight:700}#clockd{font-size:12px;opacity:.85}
#info{max-width:1280px;margin:6px auto;padding:0 8px;font-size:12px;opacity:.8}
.panel{max-width:1280px;margin:8px auto;padding:0 8px 24px;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:10px}
fieldset{border:2px solid var(--oak);background:rgba(184,123,75,.12);margin:0;padding:8px 10px}legend{padding:0 6px;color:var(--honey);font-weight:700}
button,select,input{font:inherit}button{background:var(--oak);color:var(--cream);border:2px solid #7d4f2c;padding:4px 9px;margin:2px;cursor:pointer;border-radius:0}button:hover{background:#c98a56}button.on{background:var(--moss);border-color:#5f8043;color:#1d2a12}
select,input[type=date],input[type=number]{background:var(--cocoa);color:var(--cream);border:2px solid var(--oak);padding:3px}input[type=range]{width:100%;accent-color:var(--honey)}
label{display:block;margin:4px 0}.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}canvas.i{display:inline-block;width:auto;vertical-align:middle}

<header><h1>Tally Realm · Living Scene</h1><span>Everything here is drawn live in code. Drag the time, change the weather, hand out rewards.</span></header>
<div class="stage"><canvas id="cv" width="640" height="288"></canvas><div class="sign"><div id="clock">--:--</div><div id="clockd"></div></div></div>
<div id="info"></div>
<div class="panel">
<fieldset><legend>Time &amp; date</legend><label>Time of day <input id="time" type="range" min="0" max="1439" value="720"></label>
<div class="row"><input id="date" type="date"><button id="live">Live now</button><button id="lapse">Time-lapse</button><select id="speed"><option value="300">300×</option><option value="900" selected>900×</option><option value="2400">2400×</option></select></div>

<fieldset><legend>Traveller</legend><div class="row"><select id="act"></select><button id="play">Play</button></div><label>Streak (fire + crops) <span id="streakv">3</span><input id="streak" type="range" min="0" max="30" value="3"></label><label>Cabin level <select id="cabin"><option>1</option><option>2</option><option>3</option></select></label></fieldset>
<fieldset><legend>Rewards</legend><div id="res"></div><div id="cel"></div></fieldset>
<fieldset><legend>Location &amp; motion</legend><div class="row"><label>Lat <input id="lat" type="number" step="0.1" style="width:80px"></label><label>Lon <input id="lon" type="number" step="0.1" style="width:80px"></label></div><label>Motion <select id="motion"><option value="full">Full</option><option value="calm">Calm (8 fps)</option><option value="off">Off</option></select></label></fieldset>
