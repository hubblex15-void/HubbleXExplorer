<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" shape-rendering="crispEdges">
  <!-- Outer Cocoa border with notched corners -->
  <rect x="4" y="3" width="24" height="26" fill="#3B2A20"/>
  <rect x="2" y="5" width="28" height="22" fill="#3B2A20"/>

  <!-- Oak frame body -->
  <rect x="4" y="5" width="24" height="22" fill="#B87B4B"/>
  
  <!-- Wood grain bevels (top & left light, bottom & right dark) -->
  <rect x="4" y="5" width="24" height="2" fill="#EAD7B5" opacity="0.7"/>
  <rect x="4" y="5" width="2" height="22" fill="#EAD7B5" opacity="0.7"/>
  <rect x="4" y="25" width="24" height="2" fill="#8E5A34"/>
  <rect x="26" y="5" width="2" height="22" fill="#8E5A34"/>

  <!-- Inner Parchment Ledger Face -->
  <rect x="6" y="7" width="20" height="18" fill="#F6E9D2"/>
  <rect x="6" y="7" width="20" height="2" fill="#EAD7B5"/>

  <!-- Corner nails -->
  <rect x="5" y="6" width="2" height="2" fill="#8E5A34"/>
  <rect x="25" y="6" width="2" height="2" fill="#8E5A34"/>
  <rect x="5" y="23" width="2" height="2" fill="#8E5A34"/>
  <rect x="25" y="23" width="2" height="2" fill="#8E5A34"/>

  <!-- Tally Marks on the ledger -->
  <!-- Stroke 1 -->
  <rect x="9" y="11" width="2" height="10" fill="#3B2A20"/>
  <!-- Stroke 2 -->
  <rect x="13" y="11" width="2" height="10" fill="#3B2A20"/>
  <!-- Stroke 3 -->
  <rect x="17" y="11" width="2" height="10" fill="#3B2A20"/>
  <!-- Stroke 4 -->
  <rect x="21" y="11" width="2" height="10" fill="#3B2A20"/>
  
  <!-- 5th Diagonal Slash in Honey Gold with Ember Shadow -->
  <rect x="8" y="19" width="3" height="2" fill="#E9B44C"/>
  <rect x="11" y="17" width="3" height="2" fill="#E9B44C"/>
  <rect x="14" y="15" width="4" height="2" fill="#E9B44C"/>
  <rect x="18" y="13" width="3" height="2" fill="#E9B44C"/>
  <rect x="21" y="11" width="3" height="2" fill="#E9B44C"/>

  <rect x="8" y="20" width="3" height="1" fill="#E27D4F"/>
  <rect x="11" y="18" width="3" height="1" fill="#E27D4F"/>
  <rect x="14" y="16" width="4" height="1" fill="#E27D4F"/>
  <rect x="18" y="14" width="3" height="1" fill="#E27D4F"/>
  <rect x="21" y="12" width="3" height="1" fill="#E27D4F"/>

  <!-- Golden XP Star Sparkle at Top-Right Corner -->
  <rect x="24" y="1" width="4" height="4" fill="#E9B44C"/>
  <rect x="25" y="0" width="2" height="6" fill="#E9B44C"/>
  <rect x="23" y="2" width="6" height="2" fill="#E9B44C"/>
  <rect x="25" y="2" width="2" height="2" fill="#FFF8E7"/>
</svg>
